[build-system]
requires = ["hatchling>=1.24", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "var2fold"
version = "0.1.0"
description = "Link genetic variants to AlphaGenome regulatory predictions and AlphaFold DB 3D structures."
dynamic = ["readme"]
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "amarcos20" }]
keywords = ["bioinformatics", "genomics", "variant-annotation", "alphafold", "alphagenome", "clinvar", "protein-structure"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "biopython>=1.83",
    "pandas>=2.1",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# The official AlphaGenome SDK (gRPC). Kept optional so the AlphaFold /
# annotation parts of the tool install and run without it.
alphagenome = ["alphagenome>=2.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]
notebook = ["matplotlib>=3.8", "ipykernel>=6.29", "nbclient>=0.10", "nbformat>=5.10", "papermill>=2.6", "nbconvert>=7.16"]

[project.urls]
Homepage = "https://amarcos20.github.io/var2fold/"
Repository = "https://github.com/amarcos20/var2fold"
Issues = "https://github.com/amarcos20/var2fold/issues"

[project.scripts]
var2fold = "var2fold.pipeline:main"

# PyPI does not resolve relative links: point them at GitHub (images at the raw files).
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '!\[(.*?)\]\((?!https?://)(.*?)\)'
replacement = '![\1](https://raw.githubusercontent.com/amarcos20/var2fold/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)(.*?)\)'
replacement = '](https://github.com/amarcos20/var2fold/blob/main/\1)'

[tool.hatch.build.targets.sdist]
include = ["src/var2fold", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/var2fold"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
exclude = ["*.ipynb"]  # generated by notebooks/build_notebook.py

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"notebooks/build_notebook.py" = ["E501"]
"notebooks/build_gene_report.py" = ["E501"]  # long Markdown prose in cell sources
"notebooks/build_benchmark.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
